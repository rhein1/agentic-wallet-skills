<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agoragentic finance skill experiments</title>
  <desc id="desc">A clear separation between upstream Coinbase wallet execution skills and Agoragentic planning-only finance skills that expose no live tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081120"/><stop offset="1" stop-color="#16233b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45d6df"/><stop offset="1" stop-color="#ff7453"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 108H1280M0 320H1280M0 532H1280M170 0V640M640 0V640M1110 0V640" stroke="#263550" opacity="0.52"/>
  <rect x="58" y="54" width="7" height="532" rx="3" fill="url(#accent)"/>
  <text x="104" y="122" fill="#45d6df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750" letter-spacing="2">DOWNSTREAM EXPERIMENTAL FORK</text>
  <text x="104" y="218" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">Finance planning skills</text>
  <text x="104" y="290" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">without hidden execution</text>
  <text x="104" y="362" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="760">authority.</text>
  <text x="104" y="430" fill="#b8c5d9" font-family="Inter, Arial, sans-serif" font-size="23">Agoragentic additions are instruction-only and expose no tools.</text>
  <text x="104" y="500" fill="#ff9279" font-family="JetBrains Mono, Consolas, monospace" font-size="18">allowed-tools: []</text>

  <g transform="translate(724 88)">
    <rect width="492" height="464" rx="28" fill="#0b1527" stroke="#2a3a56" stroke-width="2"/>
    <g transform="translate(30 30)">
      <rect width="432" height="148" rx="18" fill="#101d33" stroke="#ff7453" stroke-opacity="0.55"/>
      <text x="24" y="32" fill="#ff9b84" font-family="JetBrains Mono, Consolas, monospace" font-size="13">UPSTREAM WALLET SKILLS</text>
      <text x="24" y="66" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750">authenticate · fund · send · trade</text>
      <text x="24" y="94" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">maintained upstream by Coinbase</text>
      <text x="24" y="119" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">use upstream for current execution behavior</text>
    </g>
    <path d="M246 180V208" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(30 212)">
      <rect width="432" height="190" rx="18" fill="#101d33" stroke="#45d6df" stroke-opacity="0.5"/>
      <text x="24" y="32" fill="#75edf3" font-family="JetBrains Mono, Consolas, monospace" font-size="13">AGORAGENTIC ADDITIONS</text>
      <text x="24" y="67" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750">research · readiness · policy review</text>
      <text x="24" y="98" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">no account reads · no orders · no payments</text>
      <text x="24" y="124" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">no provider calls · no wallet movement</text>
      <text x="24" y="150" fill="#91a3be" font-family="Inter, Arial, sans-serif" font-size="14">candidate actions remain non-executable</text>
    </g>
  </g>
</svg>
